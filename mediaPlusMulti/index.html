<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão CSS, HTML e JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Revisão CSS, HTML e JS</h1>
        <div class="wrap-inputs">
            <label for="nome">Nome:</label>
            <input id="nome" type="text" placeholder="Insira seu nome">
        </div>
        <div class="wrap-inputs">
            <label for="nota1">Nota 1:</label>
            <input id="nota1" type="number" placeholder="Insira sua nota">
        </div>
        <div class="wrap-inputs">
            <label for="nota2">Nota 2:</label>
            <input id="nota2" type="number" placeholder="Insira sua nota">
        </div>
        <div class="wrap-inputs">
            <label for="nota3">Nota 3:</label>
            <input id="nota3" type="number" placeholder="Insira sua nota">
        </div>
        <button onclick="calcular()">CALCULAR</button>
    </main>
    <p id="resposta"></p>
    <script src="script.js"></script>
</body>
</html>
